<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Page not found — RenalRoute</title>

<!-- ═══════════ 404 ═══════════
     An independent scan navigated to a nonexistent route and got the
     host's raw NOT_FOUND page: no branding, no explanation, and — the
     part that actually matters — no way back into the app. Somebody who
     mistypes a URL or follows a stale link should not hit a dead end.

     Vercel serves this file automatically for unmatched routes on a
     static deployment, so it needs no routing config.

     It reuses the app's own stylesheet and the boot screen's classes, so
     it inherits the palette, the theme, and the mark without a second
     set of rules to keep in sync. No inline style and no inline script:
     the CSP allows neither, and a 404 page that trips the policy is a
     worse failure than the one it replaces.

     js/theme.js runs here too, so somebody on dark does not get a white
     flash on the way to being told a page is missing. -->
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FBF7F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17150F" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="css/bundle.css">
<script src="js/theme.js"></script>
</head>
<body>

<main class="boot" id="notFound">
  <div class="boot__inner">
    <svg class="boot__mark boot__mark--still" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <circle cx="16" cy="16" r="12.5" class="boot__mark-track" stroke-width="3"/>
      <circle cx="16" cy="16" r="12.5" class="boot__mark-fill" stroke-width="3"
              stroke-dasharray="47 78.5" stroke-linecap="round" transform="rotate(-77 16 16)"/>
    </svg>

    <h1 class="boot__word">Page not found</h1>

    <p class="boot__lede">
      That address doesn&rsquo;t match anything in RenalRoute. It may have been
      mistyped, or it may be a link from an older version.
    </p>

    <!-- The whole reason this page exists: a way back. -->
    <p class="notfound__actions">
      <a class="btn btn--primary" href="/">Go to RenalRoute</a>
    </p>

    <p class="boot__lede notfound__note">
      Nothing you have logged is affected &mdash; your data lives on this device
      and is untouched.
    </p>
  </div>
</main>

</body>
</html>
